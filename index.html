<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MdfKesim Pro - Üretim Yönetimi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="logo-area">
                <h2><i class="fas fa-layer-group"></i> MdfKesim <span class="badge">PRO</span></h2>
            </div>

            <div class="panel-section toolbar">
                <button id="save-btn" data-tooltip="Projeyi Kaydet"><i class="fas fa-save"></i></button>
                <button id="load-btn" data-tooltip="Projeyi Yükle"><i class="fas fa-folder-open"></i></button>
                <button id="dl-template-btn" data-tooltip="Örnek Excel Şablonu"><i class="fas fa-file-csv"></i></button>
                <label for="excel-upload" class="btn-icon" data-tooltip="Excel Dosyası Yükle"><i class="fas fa-file-upload"></i></label>
                <input type="file" id="excel-upload" accept=".xlsx, .xls" style="display:none;">
                <button id="clear-btn" data-tooltip="Listeyi Temizle"><i class="fas fa-trash-alt"></i></button>
            </div>

            <div class="panel-section">
                <h3><i class="fas fa-ruler-combined"></i> Plaka & Maliyet</h3>
                <div class="input-group">
                    <select id="stdStockSelect">
                        <option value="2100-2800">2100 x 2800 mm (Standart)</option>
                        <option value="1830-3660">1830 x 3660 mm (Jumbo)</option>
                        <option value="custom">Özel Ölçü...</option>
                    </select>
                </div>
                <div class="input-group">
                    <input type="number" id="stockW" value="2100" placeholder="G">
                    <span>x</span>
                    <input type="number" id="stockH" value="2800" placeholder="Y">
                </div>
                <div class="settings-grid">
                    <div>
                        <label>Bıçak (mm)</label>
                        <input type="number" id="kerf" value="3">
                    </div>
                    <div>
                        <label>Bant (mm)</label>
                        <input type="number" id="bandingThick" value="1" step="0.1">
                    </div>
                </div>
                <div class="settings-grid">
                    <div>
                        <label>Plaka ₺</label>
                        <input type="number" id="sheetPrice" value="1500">
                    </div>
                    <div>
                        <label>Kesim ₺/m</label>
                        <input type="number" id="cutPrice" value="10">
                    </div>
                </div>
            </div>

            <div class="panel-section flex-grow">
                <h3><i class="fas fa-list"></i> Parça Listesi</h3>
                <div class="parts-header">
                    <span>Adı</span>
                    <span>En</span>
                    <span>Boy</span>
                    <span>Adet</span>
                    <span><i class="fas fa-sync-alt" title="Döndürme"></i></span>
                    <span title="Kenar Bantlama">Bant</span>
                    <span></span>
                </div>
                <div id="parts-list">
                </div>
                <button id="add-part-btn" class="btn-secondary"><i class="fas fa-plus"></i> Manuel Ekle</button>
            </div>

            <div class="action-area">
                <button id="calculate-btn" class="btn-primary">HESAPLA & ÇİZ</button>
                <div class="button-group">
                    <button id="download-pdf-btn" class="btn-danger" style="display:none;">
                        <i class="fas fa-file-pdf"></i> PLAN
                    </button>
                    <button id="print-label-btn" class="btn-warning" style="display:none;">
                        <i class="fas fa-tags"></i> ETİKET
                    </button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="stats-bar">
                <div class="stat-item">
                    <span>Plaka</span>
                    <strong id="total-sheets">0</strong>
                    <i class="fas fa-layer-group stat-icon"></i>
                </div>
                <div class="stat-item">
                    <span>Verim</span>
                    <strong id="efficiency-rate">%0</strong>
                    <i class="fas fa-chart-pie stat-icon"></i>
                </div>
                <div class="stat-item">
                    <span>Toplam Maliyet</span>
                    <strong id="total-cost" class="highlight">0 ₺</strong>
                    <i class="fas fa-wallet stat-icon"></i>
                </div>
                <div class="stat-item">
                    <span>Kesim Metrajı</span>
                    <strong id="total-cut-len">0 m</strong>
                    <i class="fas fa-ruler-combined stat-icon"></i>
                </div>
            </div>

            <div class="canvas-wrapper">
                <canvas id="cutCanvas"></canvas>
            </div>

            <div class="offcuts-panel">
                <h4><i class="fas fa-recycle"></i> Değerlendirilebilir Artan Parçalar (>30cm)</h4>
                <div id="offcuts-list" class="offcuts-grid">
                    <span>Hesaplama bekleniyor...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
